name = "portfolio-estimator"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# Workers AI (free plan: 10,000 neurons/day, resets 00:00 UTC)
[ai]
binding = "AI"

# Per-visitor daily counters. Create with:
#   npx wrangler kv namespace create ESTIMATOR_KV
# and paste the returned id below.
[[kv_namespaces]]
binding = "ESTIMATOR_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
ALLOWED_ORIGINS = "https://sachinchoudhary07.github.io,http://localhost:3000"
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
DAILY_LIMIT = "3"
MOCK_AI = "false"

# Secret (not in this file): TURNSTILE_SECRET
#   npx wrangler secret put TURNSTILE_SECRET
